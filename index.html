<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AV</title>
  <link rel="stylesheet" href="assets/icons.css">
  <link rel="stylesheet" href="assets/home.css">
  <link rel="stylesheet" href="assets/sound.css">
</head>
<body>
  <main>
    <h1 class="sr-only">AV: film, design, about, miscellaneous</h1>

    <div class="stage" id="stage">
      <svg viewBox="-100 -100 200 200" aria-hidden="true">
        <!-- Dashed ring. Dashes are generated in home.js. -->
        <g id="ring"></g>

        <!-- Leader lines at each label, drawn in when that quarter is active. -->
        <g class="leaders">
          <line data-q="film"   x1="0"   y1="-70" x2="0"   y2="-80"/>
          <line data-q="misc"   x1="70"  y1="0"   x2="80"  y2="0"/>
          <line data-q="about"  x1="0"   y1="70"  x2="0"   y2="80"/>
          <line data-q="design" x1="-70" y1="0"   x2="-80" y2="0"/>
        </g>

        <!-- Center: a serif asterisk at rest, the section's icon when a quarter is active.
             Icons scale in from .icon, so position offsets live on an inner group. -->
        <text class="dot">*</text>

        <!-- Film: reels turn. -->
        <g class="icon" data-q="film">
          <g transform="translate(0 2.75)">
            <g class="reel">
              <circle cx="-7.5" cy="-9.5" r="5"/>
              <circle class="fill" cx="-7.5" cy="-12.1" r="1.1"/>
              <circle class="fill" cx="-5.25" cy="-8.2" r="1.1"/>
              <circle class="fill" cx="-9.75" cy="-8.2" r="1.1"/>
            </g>
            <g class="reel">
              <circle cx="2.5" cy="-9.5" r="5"/>
              <circle class="fill" cx="2.5" cy="-12.1" r="1.1"/>
              <circle class="fill" cx="4.75" cy="-8.2" r="1.1"/>
              <circle class="fill" cx="0.25" cy="-8.2" r="1.1"/>
            </g>
            <rect x="-12" y="-4" width="17" height="13"/>
            <path d="M5 0 L12 -3 L12 8 L5 5 Z"/>
          </g>
        </g>

        <!-- Design: the eye blinks. -->
        <g class="icon" data-q="design">
          <g class="lid">
            <path d="M-13 0 Q0 -10 13 0 Q0 10 -13 0 Z"/>
            <circle class="fill" r="2.6"/>
          </g>
        </g>

        <!-- About: the question mark tilts like a curious head, then the dot hops. -->
        <g class="icon" data-q="about">
          <g transform="translate(0 1)">
            <g class="tilt">
              <path d="M-4.5 -7 C-4.5 -12.5 5 -12.5 5 -7 C5 -3 0 -3 0 2.5"/>
              <circle class="fill hop" cy="8" r="1.3"/>
            </g>
          </g>
        </g>

        <!-- Misc: a ball of static. Lines are regenerated in home.js while visible. -->
        <g class="icon" data-q="misc">
          <path class="static"/>
          <path class="static"/>
          <path class="static"/>
        </g>
      </svg>

      <nav aria-label="Sections">
        <a class="q q-film"   data-q="film"   href="/film/">film</a>
        <a class="q q-misc"   data-q="misc"   href="/misc/">miscellaneous</a>
        <a class="q q-about"  data-q="about"  href="/about/">about</a>
        <a class="q q-design" data-q="design" href="/design/">design</a>
      </nav>
    </div>
  </main>

  <script src="assets/static.js"></script>
  <script src="assets/home.js"></script>
  <script src="assets/site.js"></script>
  <script src="assets/sound.js"></script>
  <script src="assets/nav.js"></script>
</body>
</html>
